[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-radius-guard"
version = "0.1.0"
description = "Static blast-radius analysis for shell commands an AI agent runs — allow / review / block, with reasons."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rishikesh Nair" }]
keywords = ["ai-safety", "agents", "shell", "security", "static-analysis", "guardrail", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
bench = ["pandas", "pyarrow"]
test = ["pytest"]

[project.scripts]
blast-radius = "blast_radius.cli:main"

[project.urls]
Homepage = "https://rishikeshn-eng.github.io/blast-radius/"
Source = "https://github.com/rishikeshn-eng/blast-radius"

[tool.setuptools]
packages = ["blast_radius"]
